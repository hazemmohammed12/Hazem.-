name: Convert HTML to Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova globally
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create myApp com.hazem.tech HazemTech
          cd myApp
          # نسخ ملف الـ html والأيقونة إلى مجلد المشروع
          cp ../index.html www/index.html
          if [ -f ../icon.png ]; then cp ../icon.png www/icon.png; fi
          
          cordova platform add android

      - name: Build APK
        run: |
          cd myApp
          cordova build android --release

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HazemTech-App-APK
          path: |
            myApp/platforms/android/app/build/outputs/apk/release/*.apk
            myApp/platforms/android/app/build/outputs/apk/unsigned/*.apk
